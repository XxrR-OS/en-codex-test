server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:english_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_db_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.english.platform.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 配置
jwt:
  secret: ${JWT_SECRET:your_jwt_secret_key_at_least_32_characters}
  expiration: 86400000   # 24小时，毫秒

# 通义千问 API
tongyi:
  api-key: ${TONGYI_API_KEY:your_tongyi_api_key}
  base-url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation



# 文件上传目录
upload:
  path: ./uploads/audio/

logging:
  level:
    com.english.platform: debug
